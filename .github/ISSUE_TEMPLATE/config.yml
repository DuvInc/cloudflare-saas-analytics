# Every URL below points at the upstream project. Forked this tool? Repoint
# them at your repository, or delete this folder.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/DuvInc/cloudflare-saas-analytics/discussions
    about: Anything that is not a bug report or a concrete feature request. Early feedback is very welcome.
  - name: Security issue
    url: https://github.com/DuvInc/cloudflare-saas-analytics/security/advisories/new
    about: Please report privately rather than in a public issue.
  - name: A problem with Cloudflare itself
    url: https://community.cloudflare.com
    about: Plan limits, Pipelines, D1 or R2 behaviour and the dashboard belong with Cloudflare.
